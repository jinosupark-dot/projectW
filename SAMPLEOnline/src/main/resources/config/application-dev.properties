# Message 설정
spring.messages.basename=config/dev/message-common.properties
spring.messages.encoding=UTF-8

# Logback 설정
# ===================================================================
# 로깅 경로 및 패키지별 로그 레벨 설정 (Spring Boot 3.5 표준)
# ===================================================================
# SQL 로그를 남기고 싶으면 아래 주석을 해제하고, SQL 로그 레벨을 DEBUG로 변경
logging.level.kr.co.wllife.acs.online.fwk.com.cmm=DEBUG
logging.config=classpath:config/dev/logback.xml
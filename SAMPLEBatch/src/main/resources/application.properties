# ===== 업무 DB =====
app.datasource.business.url=jdbc:log4jdbc:oracle:thin:@//192.168.45.214:1522/XEPDB1
app.datasource.business.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
app.datasource.business.username=biz_user
app.datasource.business.password=1234
app.datasource.business.hikari.maximum-pool-size=10

# ===== 메타 DB =====
app.datasource.meta.url=jdbc:log4jdbc:oracle:thin:@//192.168.45.214:1522/XEPDB1
app.datasource.meta.driver-class-name=net.sf.log4jdbc.sql.jdbcapi.DriverSpy
app.datasource.meta.username=meta_user
app.datasource.meta.password=1234
app.datasource.meta.hikari.maximum-pool-size=5

# ==== 에러 방지 ORA-08177: 이 트랜잭션에 대한 직렬화 액세스를 할 수 없습니다
spring.batch.jdbc.isolation-level-for-create=read_committed

# ===== 배치 =====
# 자동실행 끔
spring.batch.job.enabled=false
# 배치 메타테이블만 별도 스키마로 분리 (완전하지 않음 - BATCH_ 로 시작하는 커스텀 테이블이 있어서 소스 에서 다시 거르고 있음)
spring.batch.jdbc.table-prefix=BATCH_
# 재생성 방지
spring.batch.jdbc.initialize-schema=never


